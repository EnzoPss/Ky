<section id="post-bac">
  <h3 id="titre">Parcours professionnel</h3>

  <div class="accordion">

    <div class="accordion-item" *ngFor="let item of items; let i = index" [class.open]="openIndex === i">
      <button class="accordion-header" (click)="toggle(i)">
        <div class="accordion-heading">
          <span class="accordion-title">{{ item.title }}</span>
          <span class="accordion-company">{{ item.company }}</span>
        </div>
        <span class="accordion-date">{{ item.date }}</span>
        <i class="bi bi-chevron-down accordion-icon"></i>
      </button>

      <div class="accordion-body">
        <div class="accordion-body-inner">
          <p>{{ item.description }}</p>
        </div>
      </div>
    </div>

  </div>
</section>
